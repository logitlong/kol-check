<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOL Check · 财经博主可信度验证</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #07090c; --panel: #0d1117; --panel2: #111822; --ink: #d9e2ec; --muted: #6f8196; --line: #1c2733; --line2: #2a3948;
    --accent: #f0b429; --cyan: #3cc8ff; --good: #17c98b; --bad: #ff4d5e; --warn: #f0b429; --chip: #16202b;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "PingFang SC", "Hiragino Sans", "Noto Sans CJK SC", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; color: var(--ink); font: 14.5px/1.6 var(--sans);
    background-color: var(--bg);
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 44px 44px; background-position: -1px -1px; background-attachment: fixed;
  }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% -10%, rgba(60,200,255,.10), transparent 55%), linear-gradient(rgba(7,9,12,.86), rgba(7,9,12,.94)); z-index: 0; }
  main { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 0 16px 80px; }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line2); margin-bottom: 22px; font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: .06em; }
  .logo { color: var(--ink); font-weight: 700; font-size: 15px; letter-spacing: .12em; white-space: nowrap; }
  .logo b { color: var(--accent); }
  .logo i { display: inline-block; width: 8px; height: 15px; background: var(--accent); margin-left: 6px; vertical-align: -2px; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .feeds { display: flex; gap: 14px; flex-wrap: wrap; justify-content: flex-end; }
  .feeds span::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--good); margin-right: 6px; box-shadow: 0 0 8px var(--good); }
  h1 { font-size: 30px; line-height: 1.25; margin: 0 0 8px; letter-spacing: -0.01em; font-weight: 700; }
  h1 em { font-style: normal; color: var(--accent); }
  .sub { color: var(--muted); margin: 0 0 22px; max-width: 46em; }
  .markets { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 22px; font-family: var(--mono); font-size: 11.5px; }
  .markets span { border: 1px solid var(--line2); padding: 2px 8px; color: var(--cyan); letter-spacing: .08em; }

  h2 { font: 600 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0 0 14px; display: flex; align-items: center; gap: 8px; }
  h2::before { content: ""; width: 8px; height: 8px; background: var(--accent); }
  h3 { font-size: 14px; margin: 18px 0 6px; color: var(--cyan); }
  .card { position: relative; background: var(--panel); border: 1px solid var(--line2); padding: 18px; margin-bottom: 14px; }
  .card::before, .card::after { content: ""; position: absolute; width: 10px; height: 10px; border: 1px solid var(--accent); opacity: .7; }
  .card::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  .card::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }

  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  input[type=text], input[type=password], input[type=url], select {
    padding: 11px 12px; border: 1px solid var(--line2); border-radius: 0; background: #070b10; color: var(--ink); font: 16px var(--mono); max-width: 100%; outline: none; }
  input:focus, select:focus { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan) inset; }
  input::placeholder { color: #44556a; }
  input[type=text], input[type=password], input[type=url] { flex: 1; min-width: 200px; }
  button { font: inherit; cursor: pointer; border-radius: 0; }
  button.go { background: var(--accent); color: #0a0d10; border: 0; padding: 12px 22px; font: 700 14px var(--mono); letter-spacing: .08em; }
  button.go:hover { filter: brightness(1.1); }
  button.go:disabled { opacity: .5; cursor: progress; }
  button.ghost { background: transparent; border: 1px solid var(--line2); color: var(--ink); padding: 8px 14px; font-size: 13px; }
  button.ghost:hover { border-color: var(--cyan); color: var(--cyan); }
  .seg { background: transparent; border: 1px solid var(--line2); color: var(--muted); padding: 9px 16px; font-size: 13.5px; }
  .seg[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: rgba(240,180,41,.08); }
  #maxCustom { flex: 0 1 150px; min-width: 110px; }
  .info { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--cyan); background: transparent; color: var(--cyan); font: italic 700 12px/1 Georgia, serif; padding: 0; margin-left: 6px; vertical-align: 1px; }
  .info[aria-expanded="true"] { background: var(--cyan); color: #07090c; }
  .field { margin-top: 12px; }
  .field > label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 5px; }
  .hint { color: var(--muted); font-size: 12.5px; margin-top: 8px; }
  .notice { border-left: 2px solid var(--warn); padding: 8px 12px; background: var(--chip); font-size: 13px; margin-top: 12px; font-family: var(--mono); }
  .error { border-left-color: var(--bad); color: var(--bad); }
  .ok { color: var(--good); } .missing { color: var(--warn); }
  #keyStatus { font-family: var(--mono); }
  .bar { height: 6px; background: var(--chip); overflow: hidden; margin-top: 10px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); box-shadow: 0 0 10px var(--accent); transition: width .4s; }
  .bar.indet i { width: 30%; animation: slide 1.3s infinite linear; }
  @keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }

  .hero { display: grid; grid-template-columns: 160px 1fr; gap: 24px; align-items: center; }
  @media (max-width: 600px) { .hero { grid-template-columns: 1fr; justify-items: center; text-align: center; } h1 { font-size: 24px; } .feeds { display: none; } }
  .ring { width: 160px; height: 160px; }
  .ring text { fill: var(--ink); font-weight: 700; font-family: var(--mono); }
  .grade { font: 700 20px var(--mono); margin: 0 0 4px; letter-spacing: .02em; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 10px; word-break: break-word; font-family: var(--mono); line-height: 1.7; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .tile { background: var(--panel); border: 1px solid var(--line2); border-top: 2px solid var(--cyan); padding: 12px 14px; }
  .tile b { display: block; font: 700 24px var(--mono); font-variant-numeric: tabular-nums; }
  .tile span { color: var(--muted); font-size: 12px; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font: 500 11px var(--mono); letter-spacing: .08em; white-space: nowrap; border-bottom-color: var(--line2); background: var(--panel2); }
  tbody tr:hover td, tr:hover td { background: rgba(60,200,255,.04); }
  td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  td b { font-family: var(--mono); }
  .pos { color: var(--good); } .neg { color: var(--bad); } .dim { color: var(--muted); }
  .chip { display: inline-block; padding: 1px 7px; background: var(--chip); border: 1px solid var(--line2); font: 11px var(--mono); white-space: nowrap; letter-spacing: .04em; }
  .chip.bull { color: var(--good); border-color: rgba(23,201,139,.45); } .chip.bear { color: var(--bad); border-color: rgba(255,77,94,.45); }
  .post { max-width: 380px; min-width: 220px; }
  .post small { color: var(--muted); display: block; }
  a { color: var(--cyan); }
  code { font-family: var(--mono); color: var(--accent); }
  details > summary { cursor: pointer; font-weight: 600; list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before { content: "[+] "; font-family: var(--mono); color: var(--accent); }
  details[open] > summary::before { content: "[−] "; }
  details p, details li { color: #9fb0c2; font-size: 13.5px; }
  details ol, details ul { padding-left: 20px; margin: 6px 0; }
  .flag { margin-bottom: 10px; }
  .flag q { display: block; color: var(--muted); font-size: 12.5px; margin-left: 12px; }
  .kols { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .kol { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line2); padding: 10px 12px; background: #090d12; color: var(--ink); text-align: left; width: 100%; }
  .kol:hover { border-color: var(--cyan); }
  .kol .s { font: 700 24px var(--mono); min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; }
  .kol b { font-family: var(--mono); }
  .kol small { color: var(--muted); display: block; font-size: 11.5px; }
  footer { font: 11.5px var(--mono); color: var(--muted); text-align: center; margin-top: 26px; letter-spacing: .04em; }
  .lang { padding: 5px 8px; font: 12px var(--mono); background: #070b10; color: var(--ink); border: 1px solid var(--line2); }
  .topbar { flex-wrap: wrap; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="topbar">
    <div class="logo">KOL<b>//</b>CHECK<i></i></div>
    <div class="feeds"><span data-t="top.feed1"></span><span data-t="top.feed2"></span><span data-t="top.feed3"></span></div>
    <select id="lang" class="lang" aria-label="Language">
      <option value="zh-CN">简体中文</option>
      <option value="zh-TW">繁體中文</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
      <option value="es">Español</option>
      <option value="pt">Português</option>
    </select>
  </div>
  <h1 data-th="hero.h1"></h1>
  <p class="sub" data-t="hero.sub"></p>
  <div class="markets"><span data-t="mk.us"></span><span data-t="mk.jp"></span><span data-t="mk.kr"></span><span data-t="mk.hk"></span><span data-t="mk.crypto"></span></div>

  <section class="card" id="kolsCard" hidden>
    <h2 data-t="kols.title"></h2>
    <div class="kols" id="kols"></div>
    <div class="hint" data-t="kols.hint"></div>
  </section>

  <section class="card">
    <h2 data-t="run.title"></h2>
    <div class="row">
      <input id="handle" type="text" data-tp="run.ph" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="go" class="go"></button>
    </div>
    <div class="field" id="maxRow">
      <label><span data-t="limit.label"></span> <button type="button" class="info" id="costBtn" data-ta="limit.info" aria-expanded="false">i</button></label>
      <div class="row">
        <button type="button" class="seg" data-mode="all" aria-pressed="true" data-t="limit.all"></button>
        <button type="button" class="seg" data-mode="custom" aria-pressed="false" data-t="limit.custom"></button>
        <input id="maxCustom" type="text" inputmode="numeric" pattern="[0-9]*" data-tp="limit.ph" autocomplete="off" hidden>
      </div>
      <div class="notice" id="costTip" hidden></div>
    </div>
    <div class="hint" data-t="run.hint"></div>
    <div id="keyStatus" class="hint"></div>
    <div id="error" class="notice error" hidden></div>
    <div id="progress" hidden>
      <div class="notice" id="stage"></div>
      <div class="bar" id="bar"><i></i></div>
      <div class="hint" data-t="prog.hint"></div>
    </div>
  </section>

  <section class="card">
    <details id="keysBox">
      <summary><span data-t="keys.title"></span> <span id="keysBadge" class="chip"></span></summary>
      <p data-th="keys.intro"></p>

      <div class="field">
        <label for="fetchKey" data-t="keys.fetch"></label>
        <input id="fetchKey" type="password" data-tp="keys.fetchPh" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="provider" data-t="keys.provider"></label>
        <select id="provider"></select>
      </div>
      <div class="field">
        <label for="aiKey"><span data-t="keys.aiKey"></span> <span id="aiKeyHint"></span></label>
        <input id="aiKey" type="password" data-tp="keys.aiKeyPh" autocomplete="off" autocapitalize="off" spellcheck="false">
        <div class="hint" id="aiKeyLink"></div>
      </div>
      <div class="field" id="baseUrlRow" hidden>
        <label for="baseUrl" data-t="keys.baseUrl"></label>
        <input id="baseUrl" type="url" placeholder="https://api.example.com/v1" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="aiModelText" data-t="keys.model"></label>
        <select id="aiModelSel" hidden></select>
        <input id="aiModelText" type="text" data-tp="keys.modelPh" autocomplete="off" autocapitalize="off" spellcheck="false">
        <div class="hint" data-t="keys.modelHint"></div>
      </div>
      <div class="field">
        <label><input type="checkbox" id="vision"> <span data-t="keys.vision"></span></label>
      </div>
      <div class="row" style="margin-top:14px">
        <button class="ghost" id="saveKeys" data-t="keys.save"></button>
        <button class="ghost" id="clearKeys" data-t="keys.clear"></button>
        <span id="keysSaved" class="hint" style="margin:0"></span>
      </div>
    </details>
  </section>

  <section class="card">
    <details id="guide">
      <summary data-t="guide.title"></summary>
      <h3 data-t="guide.h1"></h3>
      <ol><li data-th="guide.s1a"></li><li data-th="guide.s1b"></li><li data-t="guide.s1c"></li></ol>
      <p data-th="guide.fee"></p>
      <h3 data-t="guide.h2"></h3>
      <p data-t="guide.p2"></p>
      <ul id="providerGuide"></ul>
      <p data-th="guide.choose"></p>
      <p data-t="guide.cost"></p>
      <h3 data-t="guide.h3"></h3>
      <ol><li data-t="guide.u1"></li><li data-t="guide.u2"></li><li data-t="guide.u3"></li></ol>
    </details>
  </section>

  <div id="result" hidden>
    <section class="card hero">
      <svg class="ring" viewBox="0 0 120 120" role="img" aria-label="Score">
        <circle cx="60" cy="60" r="50" fill="none" stroke="var(--line2)" stroke-width="8" stroke-dasharray="2 4"/>
        <circle id="arc" cx="60" cy="60" r="50" fill="none" stroke-width="8" stroke-linecap="butt" transform="rotate(-90 60 60)"/>
        <text id="scoreText" x="60" y="66" text-anchor="middle" font-size="34"></text>
        <text x="60" y="86" text-anchor="middle" font-size="8.5" style="fill:var(--muted);font-weight:400;letter-spacing:.1em">SCORE / 100</text>
      </svg>
      <div>
        <p class="grade" id="grade"></p>
        <div id="verdict"></div>
        <div class="meta" id="meta"></div>
      </div>
    </section>
    <div class="tiles" id="tiles"></div>
    <section class="card">
      <h2 data-t="hz.title"></h2>
      <div class="scroll"><table id="horizons"></table></div>
      <div class="hint" data-th="hz.hint"></div>
    </section>
    <section class="card">
      <h2 data-t="fl.title"></h2>
      <div id="flags"></div>
    </section>
    <section class="card">
      <h2 data-t="sym.title"></h2>
      <div class="scroll"><table id="symbols"></table></div>
    </section>
    <section class="card">
      <h2 data-t="calls.title"></h2>
      <div class="scroll"><table id="calls"></table></div>
    </section>
  </div>

  <section class="card">
    <details>
      <summary data-t="method.title"></summary>
      <ul>
        <li data-th="method.m1"></li><li data-th="method.m2"></li><li data-th="method.m3"></li><li data-th="method.m4"></li>
        <li data-th="method.m5"></li><li data-th="method.m6"></li><li data-th="method.m7"></li>
      </ul>
    </details>
  </section>
  <footer data-t="footer"></footer>
</main>

<script src="/i18n/zh-CN.js"></script>
<script src="/i18n/zh-TW.js"></script>
<script src="/i18n/en.js"></script>
<script src="/i18n/ja.js"></script>
<script src="/i18n/ko.js"></script>
<script src="/i18n/es.js"></script>
<script src="/i18n/pt.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (x, d = 1) => (x == null ? "—" : (x > 0 ? "+" : "") + (x * 100).toFixed(d) + "%");
const rate = (x) => (x == null ? "—" : Math.round(x * 100) + "%");
const cls = (x) => (x == null ? "dim" : x > 0 ? "pos" : x < 0 ? "neg" : "");
const safeUrl = (u) => (/^https:\/\//i.test(String(u || "")) ? u : "");
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

// —— 多语言 ——
const DICT = window.I18N || {};
const LANGS = ["zh-CN", "zh-TW", "en", "ja", "ko", "es", "pt"].filter((l) => DICT[l]);
for (const o of [...document.querySelectorAll("#lang option")]) if (!DICT[o.value]) o.remove();
function detectLang() {
  const saved = store.get("kol.lang");
  if (LANGS.includes(saved)) return saved;
  for (const raw of navigator.languages || [navigator.language || ""]) {
    const l = String(raw).toLowerCase();
    if (/^zh-(tw|hk|mo)|^zh-hant/.test(l)) return "zh-TW";
    if (l.startsWith("zh")) return "zh-CN";
    const hit = LANGS.find((x) => l.startsWith(x.toLowerCase()));
    if (hit) return hit;
  }
  return "en";
}
let lang = detectLang();
// 词条里的 {name} 会被替换；参数一律先转义，词条本身是可信的静态内容
function t(key, params) {
  let s = DICT[lang]?.[key] ?? DICT.en?.[key] ?? DICT["zh-CN"]?.[key] ?? key;
  if (params) for (const [k, v] of Object.entries(params)) s = s.split(`{${k}}`).join(esc(v));
  return s;
}
function applyLang() {
  document.documentElement.lang = lang;
  document.title = t("meta.title").replace(/&amp;/g, "&");
  document.querySelectorAll("[data-t]").forEach((el) => (el.innerHTML = t(el.dataset.t)));
  document.querySelectorAll("[data-th]").forEach((el) => (el.innerHTML = t(el.dataset.th)));
  document.querySelectorAll("[data-tp]").forEach((el) => (el.placeholder = t(el.dataset.tp).replace(/&amp;/g, "&")));
  document.querySelectorAll("[data-ta]").forEach((el) => el.setAttribute("aria-label", t(el.dataset.ta)));
  $("lang").value = lang;
  $("go").textContent = $("go").disabled ? t("run.busy") : t("run.go");
  if (caps.providers.length) renderProviders();
  refreshStatus();
  updateCostTip();
  if (lastStage) showStage(lastStage);
  if (lastError) showError(lastError);
  if (lastReport) render(lastReport, true);
  renderKols();
}

let caps = { providers: [] }, pollTimer = null, lastReport = null, lastStage = null, lastError = null, kolList = [];
const provName = (id) => t("prov." + id);

// —— Key 面板 ——
const provider = () => caps.providers.find((p) => p.id === $("provider").value) || caps.providers[0];
const aiModel = () => (provider()?.kind === "anthropic" ? $("aiModelSel").value : $("aiModelText").value.trim() || provider()?.defaultModel || "");

function renderProviders() {
  const cur = $("provider").value;
  $("provider").innerHTML = caps.providers.map((p) => `<option value="${esc(p.id)}">${provName(p.id)}</option>`).join("");
  if (cur) $("provider").value = cur;
  $("providerGuide").innerHTML = caps.providers.filter((p) => p.keyUrl).map((p) => {
    const hint = DICT[lang]?.["provHint." + p.id] ?? DICT.en?.["provHint." + p.id] ?? "";
    return `<li><b>${provName(p.id)}</b> — <a href="${esc(p.keyUrl)}" target="_blank" rel="noopener noreferrer">${t("guide.openKey")}</a>${hint ? ` · ${hint}` : ""}${p.defaultModel ? ` · ${t("guide.example")} <code>${esc(p.defaultModel)}</code>` : ""}${p.vision ? ` · ${t("guide.sees")}` : ""}</li>`;
  }).join("");
  onProviderChange(true);
}
function onProviderChange(keepModel) {
  const p = provider();
  if (!p) return;
  const isClaude = p.kind === "anthropic";
  $("aiModelSel").hidden = !isClaude;
  $("aiModelText").hidden = isClaude;
  if (isClaude) {
    const cur = $("aiModelSel").value;
    $("aiModelSel").innerHTML = p.models.map((m) => `<option value="${esc(m)}">${esc(m)}</option>`).join("");
    $("aiModelSel").value = keepModel && p.models.includes(cur) ? cur : p.defaultModel;
  } else if (!keepModel) $("aiModelText").value = p.defaultModel || "";
  if (!keepModel) $("vision").checked = Boolean(p.vision);
  $("baseUrlRow").hidden = p.id !== "custom";
  const hint = DICT[lang]?.["provHint." + p.id] ?? DICT.en?.["provHint." + p.id] ?? "";
  $("aiKeyHint").innerHTML = hint ? `(${hint})` : "";
  $("aiKeyLink").innerHTML = p.keyUrl ? `<a href="${esc(p.keyUrl)}" target="_blank" rel="noopener noreferrer">${t("keys.where", { name: "" })}${provName(p.id)}</a>` : "";
}
function loadKeys() {
  const k = store.get("kol.keys") || {};
  $("fetchKey").value = k.fetchKey || "";
  if (k.provider && caps.providers.some((p) => p.id === k.provider)) $("provider").value = k.provider;
  onProviderChange(false);
  $("aiKey").value = k.aiKey || "";
  $("baseUrl").value = k.baseUrl || "";
  if (k.model) { if (provider().kind === "anthropic") $("aiModelSel").value = k.model; else $("aiModelText").value = k.model; }
  if (typeof k.vision === "boolean") $("vision").checked = k.vision;
}
function currentKeys() {
  return { fetchKey: $("fetchKey").value.trim(), provider: $("provider").value, aiKey: $("aiKey").value.trim(), baseUrl: $("baseUrl").value.trim(), model: aiModel(), vision: $("vision").checked };
}
function refreshStatus() {
  const k = currentKeys();
  const hasFetch = Boolean(k.fetchKey) || caps.serverFetchKey;
  const hasAi = Boolean(k.aiKey) || caps.localClaude || caps.serverAiKey;
  $("keysBadge").innerHTML = hasFetch && hasAi ? t("keys.ready") : t("keys.notReady");
  const parts = [
    hasFetch ? `<span class="ok">${t("st.fetchOk")}</span>` : `<span class="missing">${t("st.fetchMissing")}</span>`,
    k.aiKey ? `<span class="ok">${t("st.aiOk", { name: "" })}${provName(k.provider)} ✓</span>`
      : hasAi ? `<span class="ok">${t("st.aiOkPlain")}</span>` : `<span class="missing">${t("st.aiMissing")}</span>`,
  ];
  $("keyStatus").innerHTML = parts.join("　") + (!hasFetch || !hasAi ? `　<a href="#" id="openKeys">${t("st.fill")}</a>` : "");
  $("openKeys")?.addEventListener("click", (e) => { e.preventDefault(); $("keysBox").open = true; $("keysBox").scrollIntoView({ behavior: "smooth" }); });
}
$("provider").addEventListener("change", () => { onProviderChange(false); refreshStatus(); });
["fetchKey", "aiKey"].forEach((id) => $(id).addEventListener("input", refreshStatus));
$("saveKeys").addEventListener("click", () => { $("keysSaved").innerHTML = store.set("kol.keys", currentKeys()) ? t("keys.saved") : t("keys.saveFail"); refreshStatus(); });
$("clearKeys").addEventListener("click", () => { store.del("kol.keys"); loadKeys(); $("keysSaved").innerHTML = t("keys.cleared"); refreshStatus(); });
$("handle").addEventListener("keydown", (e) => { if (e.key === "Enter") run(); });
$("go").addEventListener("click", run);
$("lang").addEventListener("change", () => { lang = $("lang").value; store.set("kol.lang", lang); applyLang(); });

// —— 分析多少条 + 积分估算（twitterapi.io 官方计费：每条返回的帖子 15 积分，10 万积分 = 1 美元）——
const ALL_CAP = 10000, CREDITS_PER_POST = 15;
let limitMode = "all";
const customCount = () => Math.max(20, Math.min(ALL_CAP, parseInt($("maxCustom").value, 10) || 0));
const postLimit = () => (limitMode === "all" ? ALL_CAP : customCount());
function updateCostTip() {
  const typed = parseInt($("maxCustom").value, 10) || 0;
  const n = customCount();
  $("costTip").innerHTML = (limitMode === "all"
    ? t("tip.all", { max: ALL_CAP.toLocaleString() })
    : typed
      ? t("tip.custom", { n: n.toLocaleString(), credits: (n * CREDITS_PER_POST).toLocaleString(), usd: ((n * CREDITS_PER_POST) / 100000).toFixed(2) })
      : t("tip.empty", { per: CREDITS_PER_POST, max: ALL_CAP.toLocaleString() }))
    + `<br><span class="dim">${t("tip.note")}</span>`;
}
document.querySelectorAll(".seg").forEach((b) => b.addEventListener("click", () => {
  limitMode = b.dataset.mode;
  document.querySelectorAll(".seg").forEach((x) => x.setAttribute("aria-pressed", x === b));
  $("maxCustom").hidden = limitMode !== "custom";
  if (limitMode === "custom") $("maxCustom").focus();
  updateCostTip();
}));
$("maxCustom").addEventListener("input", () => { $("maxCustom").value = $("maxCustom").value.replace(/[^0-9]/g, "").slice(0, 5); updateCostTip(); });
$("costBtn").addEventListener("click", () => {
  const open = $("costTip").hidden;
  $("costTip").hidden = !open;
  $("costBtn").setAttribute("aria-expanded", open);
  updateCostTip();
});

// —— 提交 + 轮询进度 ——
// 错误和进度都是 {code, params}，按当前语言显示；没有对应词条时退回服务器给的原文
function showError(e) {
  lastError = e;
  const key = "err." + e.code;
  const known = e.code && (DICT[lang]?.[key] || DICT.en?.[key]);
  $("error").innerHTML = known ? t(key, e.params || {}) + (e.params?.detail ? ` <span class="dim">(${esc(e.params.detail)})</span>` : "") : esc(e.message || t("err.server"));
  $("error").hidden = false;
}
function clearError() { lastError = null; $("error").hidden = true; }
function showStage(s) { lastStage = s; $("stage").innerHTML = t("stage." + s.code, s.params || {}); }
function setBusy(b) { $("go").disabled = b; $("go").textContent = b ? t("run.busy") : t("run.go"); $("progress").hidden = !b; if (!b) lastStage = null; }

async function run() {
  clearError();
  if (limitMode === "custom" && !(parseInt($("maxCustom").value, 10) >= 20)) return showError({ code: "need_count" });
  const k = currentKeys();
  const body = { source: "x", input: $("handle").value, maxPosts: postLimit(), lang };
  if (k.fetchKey) body.fetchKey = k.fetchKey;
  if (k.aiKey) body.ai = { provider: k.provider, apiKey: k.aiKey, model: k.model, baseUrl: k.baseUrl, vision: k.vision };
  setBusy(true);
  showStage({ code: "submit" });
  $("bar").className = "bar indet";
  try {
    const res = await fetch("/api/analyze", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) { setBusy(false); return showError({ code: data.code, params: data.params, message: data.error }); }
    store.set("kol.job", data.jobId);
    poll(data.jobId);
  } catch {
    setBusy(false);
    showError({ code: "network" });
  }
}

function poll(jobId) {
  clearTimeout(pollTimer);
  setBusy(true);
  const tick = async () => {
    try {
      const res = await fetch(`/api/jobs/${jobId}`);
      const j = await res.json();
      if (res.status === 404) { store.del("kol.job"); setBusy(false); return showError({ code: j.code || "job_gone", message: j.error }); }
      if (j.status === "done") { store.del("kol.job"); setBusy(false); render(j.report); loadReports(); return; }
      if (j.status === "error") { store.del("kol.job"); setBusy(false); return showError({ code: j.code, params: j.params, message: j.error }); }
      showStage({ code: j.stage || "working", params: j.stageParams });
      const hasPct = j.total > 0 && j.done != null;
      $("bar").className = hasPct ? "bar" : "bar indet";
      $("bar").firstElementChild.style.width = hasPct ? Math.min(100, (j.done / j.total) * 100) + "%" : "";
    } catch {
      // 网络抖动（手机切后台很常见）：不放弃，继续等
    }
    pollTimer = setTimeout(tick, 2500);
  };
  tick();
}
document.addEventListener("visibilitychange", () => { const id = store.get("kol.job"); if (!document.hidden && id) poll(id); });

// —— 已分析的博主 ——
function renderKols() {
  $("kolsCard").hidden = !kolList.length;
  $("kols").innerHTML = kolList.map((r) => {
    const c = r.score == null ? "dim" : r.score >= 57 ? "pos" : r.score >= 45 ? "" : "neg";
    return `<button class="kol" data-h="${esc(r.handle)}"><span class="s ${c}">${r.score ?? "?"}</span><span><b>@${esc(r.handle)}</b><small>${esc(r.name || "")} · ${t("grade." + (r.gradeKey || "insufficient"))}</small><small>${t("kols.posts", { n: r.posts ?? 0 })} · ${esc(String(r.generatedAt || "").slice(0, 10))}</small></span></button>`;
  }).join("");
  document.querySelectorAll(".kol").forEach((b) => b.addEventListener("click", () => openReport(b.dataset.h)));
}
async function loadReports() {
  try { kolList = await (await fetch("/api/reports")).json(); renderKols(); } catch {}
}
async function openReport(handle) {
  clearError();
  try {
    const res = await fetch(`/api/reports/${encodeURIComponent(handle)}`);
    const r = await res.json();
    if (!res.ok) return showError({ code: r.code, message: r.error });
    render(r);
  } catch { showError({ code: "network" }); }
}

// —— 报告（只存代号和数字，文字按当前语言拼）——
function extractorText(x) {
  if (!x || typeof x !== "object") return "";
  let s = x.kind === "rules" ? t("ext.rules") : `${x.provider ? provName(x.provider) : "AI"}${x.model ? " · " + esc(x.model) : ""}`;
  if (x.imagePosts) s += t("ext.img", { n: x.imagePosts });
  if (x.imageFallbacks) s += t("ext.imgFail", { n: x.imageFallbacks });
  if (x.uncertain) s += t("ext.uncertain", { n: x.uncertain });
  if (x.failedBatches) s += t("ext.failed", { n: x.failedBatches });
  return s;
}
function render(r, keepScroll) {
  lastReport = r;
  const P = r.primaryHorizon, h = r.horizons[P], s = r.rating.score, g = r.rating.gradeKey || "insufficient", n = r.rating.n ?? h.n ?? 0;
  const hLabel = (k) => (k === "own" ? t("hz.own") : t("hz.fixed", { k }));
  const color = s == null ? "var(--muted)" : s >= 57 ? "var(--good)" : s >= 45 ? "var(--warn)" : "var(--bad)";
  const C = 2 * Math.PI * 50;
  $("arc").setAttribute("stroke", color);
  $("arc").setAttribute("stroke-dasharray", `${((s ?? 0) / 100) * C} ${C}`);
  $("scoreText").textContent = s ?? "?";
  $("grade").innerHTML = `@${esc(r.profile.handle)} · ${t("grade." + g)}`;
  $("grade").style.color = color;
  $("verdict").innerHTML = t("verdict." + g, { n }) + (s != null && n < 20 ? " " + t("verdict.lowSample", { n }) : "");
  $("meta").innerHTML = `${r.profile.name && r.profile.name !== r.profile.handle ? esc(r.profile.name) + " ｜ " : ""}${t("meta.source")} ${t("src." + r.source)} ｜ ${t("meta.extract")} ${extractorText(r.extractor)}<br>${t("meta.posts", { n: r.posts.total, from: r.posts.from, to: r.posts.to })}` +
    (r.callStats.duplicatesMerged ? ` ｜ ${t("meta.dup", { n: r.callStats.duplicatesMerged })}` : "") +
    (r.callStats.exitSignals ? ` ｜ ${t("meta.exit", { n: r.callStats.exitSignals })}` : "") +
    ` ｜ ${t("meta.gen", { d: String(r.generatedAt).slice(0, 10) })}`;

  $("tiles").innerHTML = [
    [r.callStats.total, t("tile.calls")],
    [r.callStats.total - (h.n ?? 0), t("tile.pending")],
    [rate(h.hitRate), t("tile.hit")],
    [rate(h.winRate), t("tile.win")],
    [pct(h.avgExcess), t("tile.excess")],
  ].map(([v, l]) => `<div class="tile"><b>${v}</b><span>${l}</span></div>`).join("");

  $("horizons").innerHTML = `<tr><th>${t("hz.c.period")}</th><th class="num">${t("hz.c.n")}</th><th class="num">${t("hz.c.hit")}</th><th class="num">${t("hz.c.win")}</th><th class="num">${t("hz.c.avg")}</th><th class="num">${t("hz.c.med")}</th><th class="num">${t("hz.c.excess")}</th></tr>` +
    [P, ...r.horizonList].map((k) => { const x = r.horizons[k]; return `<tr><td>${hLabel(k)}${k === P ? ` <span class='chip'>${t("hz.basis")}</span>` : ""}</td><td class="num">${x.n}</td><td class="num">${rate(x.hitRate)}</td><td class="num">${rate(x.winRate)}</td><td class="num ${cls(x.avgReturn)}">${pct(x.avgReturn)}</td><td class="num ${cls(x.medianReturn)}">${pct(x.medianReturn)}</td><td class="num ${cls(x.avgExcess)}">${pct(x.avgExcess)}</td></tr>`; }).join("");

  $("flags").innerHTML = r.redFlags.flags.length
    ? `<p>${t("fl.summary", { total: r.posts.total, n: r.redFlags.flaggedPosts, pct: rate(r.redFlags.ratio), pen: r.rating.parts?.penalty ?? 0 })}</p>` +
      r.redFlags.flags.map((f) => `<div class="flag"><b class="neg">${t("fl." + f.id)}</b> × ${f.count}${f.examples.map((e) => `<q>${esc(e.date)}　${esc(e.text) || t("calls.imageOnly")}</q>`).join("")}</div>`).join("")
    : `<p class="dim">${t("fl.none")}</p>`;

  $("symbols").innerHTML = `<tr><th>${t("sym.c.symbol")}</th><th class="num">${t("sym.c.calls")}</th><th class="num">${t("sym.c.dir")}</th><th class="num">${t("hz.c.win")}</th><th class="num">${t("hz.c.avg")}</th></tr>` +
    r.bySymbol.map((b) => `<tr><td><b>${esc(b.symbol)}</b> <span class="dim">${esc(b.name === b.symbol ? "" : b.name)}</span></td><td class="num">${b.calls}</td><td class="num">${b.bull} / ${b.bear}</td><td class="num">${rate(b.winRate)}</td><td class="num ${cls(b.avgReturn)}">${pct(b.avgReturn)}</td></tr>`).join("");

  const cell = (o) => o ? `<td class="num"><span class="${cls(o.adj)}">${pct(o.adj)}</span><br><small class="${cls(o.excess)}">${t("calls.excess")} ${pct(o.excess)}</small></td>` : `<td class="num dim">${t("calls.pending")}</td>`;
  const own = (c) => {
    const o = c.outcomes.own, tag = t("calls.days", { n: c.horizonDays }) + (c.horizonStated ? "" : t("calls.inferred"));
    return o
      ? `<td class="num"><b class="${cls(o.adj)}">${pct(o.adj)}</b><br><small class="${cls(o.excess)}">${t("calls.excess")} ${pct(o.excess)}</small><br><small class="dim">${tag} · ${t("exit." + o.exitReason, { n: o.days })}</small></td>`
      : `<td class="num dim">${t("calls.pending")}<br><small>${tag}</small></td>`;
  };
  $("calls").innerHTML = `<tr><th>${t("calls.c.date")}</th><th>${t("sym.c.symbol")}</th><th>${t("calls.c.dir")}</th><th>${t("calls.c.post")}</th><th class="num">${t("calls.c.entry")}</th><th class="num">${t("calls.c.own")}</th>${r.horizonList.map((k) => `<th class="num">${t("calls.days", { n: k })}</th>`).join("")}</tr>` +
    r.calls.map((c) => `<tr><td style="white-space:nowrap">${esc(c.date)}</td><td><b>${esc(c.symbol)}</b></td><td><span class="chip ${c.direction === "bull" ? "bull" : "bear"}">${t(c.direction === "bull" ? "calls.bull" : "calls.bear")}</span></td>
      <td class="post">${c.fromImage ? `<span class="chip">${t("calls.fromImage")}</span> ` : ""}${esc(c.text) || `<span class="dim">${t("calls.imageOnly")}</span>`}${safeUrl(c.url) ? ` <a href="${esc(safeUrl(c.url))}" target="_blank" rel="noopener noreferrer">${t("calls.original")}</a>` : ""}${c.note ? `<small>${esc(c.note)}</small>` : ""}</td>
      ${c.status === "no_data" ? `<td class="num dim" colspan="${2 + r.horizonList.length}">${t("calls.noData")}</td>` : `<td class="num">${c.entryPrice ? c.entryPrice.toLocaleString(undefined, { maximumFractionDigits: 2 }) : "—"}<br><small class="dim">${esc(c.entryDate ?? "")} ${c.entryMode ? t("mode." + c.entryMode) : ""}</small></td>${own(c)}${r.horizonList.map((k) => cell(c.outcomes[k])).join("")}`}</tr>`).join("");
  $("result").hidden = false;
  if (!keepScroll) $("result").scrollIntoView({ behavior: "smooth", block: "start" });
}

// —— 启动 ——
applyLang();
fetch("/api/config").then((r) => r.json()).then((c) => {
  caps = c;
  renderProviders();
  loadKeys();
  refreshStatus();
  const k = currentKeys();
  if (!(k.fetchKey || c.serverFetchKey)) $("guide").open = true;
  const job = store.get("kol.job");
  if (job) poll(job);
}).catch(() => showError({ code: "network" }));
loadReports();
</script>
</body>
</html>
